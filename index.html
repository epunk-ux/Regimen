<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Regimen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14181d;
      --panel-2: #1b2026;
      --line: #262c33;
      --text: #e7ecf1;
      --muted: #8a93a0;
      --accent: #ff7a45;
      --accent-2: #ffa477;
      --done: #4ade80;
      --tap: rgba(255,122,69,0.18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: var(--tap); }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding-bottom: calc(80px + var(--safe-bottom)); }

    header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(180deg, var(--bg) 80%, transparent);
      padding: calc(12px + var(--safe-top)) 16px 8px;
    }
    .title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .title h1 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }
    .title .sub { font-size: 13px; color: var(--muted); }

    .week-rail { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .week-rail::-webkit-scrollbar { display: none; }
    .week-pill {
      flex: 0 0 auto; min-width: 56px; padding: 8px 10px;
      border-radius: 12px; background: var(--panel); color: var(--muted);
      border: 1px solid var(--line); font-weight: 600; font-size: 13px;
      text-align: center; cursor: pointer; scroll-snap-align: center;
      transition: transform 0.06s ease;
    }
    .week-pill .num { font-size: 16px; color: var(--text); display: block; }
    .week-pill.active { background: var(--accent); color: #1a0f08; border-color: var(--accent); }
    .week-pill.active .num { color: #1a0f08; }
    .week-pill.has-data { border-color: var(--done); }
    .week-pill:active { transform: scale(0.96); }

    main { padding: 4px 16px 16px; }

    .day {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; margin-bottom: 14px; overflow: hidden;
    }
    .day h2 {
      margin: 0; padding: 14px 16px;
      font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--muted); display: flex; justify-content: space-between; align-items: center;
    }
    .day h2 .count { font-size: 12px; color: var(--accent-2); }

    .ex {
      display: grid; grid-template-columns: 1fr auto auto; gap: 8px;
      align-items: center; padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    .ex .name { font-weight: 600; font-size: 16px; }
    .ex .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ex .meta .last { color: var(--accent-2); }
    .ex .meta .up-flag { color: var(--done); font-weight: 700; margin-left: 4px; }
    .ex .meta .today { color: var(--accent-2); font-weight: 600; }
    .ex .meta .today.up { color: var(--done); }
    .mark-btns { display: flex; gap: 4px; }
    .inc-btn, .hold-btn {
      background: transparent; color: var(--muted);
      border: 1px solid var(--line); border-radius: 8px;
      width: 28px; height: 44px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; line-height: 1;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .inc-btn.active {
      background: var(--done); color: #0b0d10; border-color: var(--done);
    }
    .hold-btn.active {
      background: var(--accent); color: #1a0f08; border-color: var(--accent);
    }
    .inc-btn:active, .hold-btn:active { transform: scale(0.94); }
    .ex .plates { font-size: 12px; color: var(--accent-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .ex .plates.sub { color: var(--muted); }
    .ex .plates.bar { color: var(--muted); }
    .ex .plates:empty { display: none; }
    .ex input[type="number"] {
      width: 92px; padding: 12px 10px;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 10px; color: var(--text); font-size: 17px;
      text-align: right; font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    .ex input[type="number"]::-webkit-outer-spin-button,
    .ex input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .ex input[type="number"]:focus { outline: none; border-color: var(--accent); }
    .ex.done input[type="number"] { border-color: var(--done); }

    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--panel); border-top: 1px solid var(--line);
      display: flex; padding: 8px 8px calc(8px + var(--safe-bottom));
      z-index: 20;
    }
    .tabbar button {
      flex: 1; background: transparent; border: 0; color: var(--muted);
      padding: 10px 6px; border-radius: 10px; font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .tabbar button.active { background: var(--panel-2); color: var(--text); }

    /* Progression view */
    .grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    table.grid { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 13px; }
    table.grid th, table.grid td {
      border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
      padding: 8px 10px; text-align: right; font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    table.grid th:first-child, table.grid td:first-child {
      text-align: left; position: sticky; left: 0;
      background: var(--panel); z-index: 1; font-weight: 600;
      border-right: 1px solid var(--line);
    }
    table.grid thead th { background: var(--panel-2); color: var(--muted); font-weight: 600; position: sticky; top: 0; z-index: 2; }
    table.grid thead th:first-child { z-index: 3; }
    table.grid td.has-val { color: var(--text); }
    table.grid td.empty { color: var(--muted); opacity: 0.4; }
    table.grid td.up { color: var(--done); }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar button {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .toolbar button.danger { color: #fca5a5; border-color: #5a2a2a; }

    .hidden { display: none !important; }
    .empty-state { color: var(--muted); text-align: center; padding: 40px 20px; }

    .bw {
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
      align-items: center; padding: 12px 16px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; margin-bottom: 14px;
    }
    .bw .name { font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
    .bw .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .bw .meta .last { color: var(--accent-2); }
    .bw input[type="number"] {
      width: 92px; padding: 12px 10px;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 10px; color: var(--text); font-size: 17px;
      text-align: right; font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    .bw input[type="number"]::-webkit-outer-spin-button,
    .bw input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .bw input[type="number"]:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <h1>Regimen</h1>
      <span class="sub" id="cycleLabel"></span>
    </div>
    <div class="week-rail" id="weekRail"></div>
  </header>

  <main>
    <section id="logView">
      <div id="bodyweight"></div>
      <div id="days"></div>
    </section>

    <section id="progView" class="hidden">
      <div class="toolbar">
        <button id="exportBtn">Export CSV</button>
        <button id="resetBtn" class="danger">Reset all</button>
      </div>
      <div class="grid-wrap">
        <table class="grid" id="progTable"></table>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button id="tabLog" class="active">Log</button>
    <button id="tabProg">Progression</button>
  </nav>

  <script>
    // --- Data model ---
    // Six lifts, each hit twice across the 3-day rotation.
    // Shared lifts (e.g. Bench on Day A + Day B) read/write the same weekly value.
    const EXERCISES = [
      { id: 'zercher',   name: 'Zercher squat',            scheme: '3×6', barbell: true },
      { id: 'bench',     name: 'Bench press',              scheme: '3×6', barbell: true },
      { id: 'ohp',       name: 'Overhead press',           scheme: '3×6', barbell: true },
      { id: 'rdl',       name: 'Romanian deadlift',        scheme: '3×6', barbell: true },
      { id: 'lat_over',  name: 'Lat pulldown — overhand',  scheme: '3×6', barbell: false },
      { id: 'lat_under', name: 'Lat pulldown — underhand', scheme: '3×6', barbell: false },
    ];
    const EX_BY_ID = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
    const DAYS = [
      { id: 'A', title: 'Day A — Squat + Pull', exIds: ['zercher', 'bench', 'lat_over', 'lat_under'] },
      { id: 'B', title: 'Day B — Press',        exIds: ['rdl', 'bench', 'ohp', 'lat_under'] },
      { id: 'C', title: 'Day C — Lower',        exIds: ['zercher', 'rdl', 'ohp', 'lat_over'] },
    ];

    // Plate math (lb)
    const BAR_LB = 45;
    const PLATES_LB = [45, 25, 10, 5, 2.5];
    function plateBreakdown(weight) {
      if (weight === '' || weight === null || weight === undefined) return null;
      const total = Number(weight);
      if (isNaN(total) || total < 0) return null;
      if (total === 0 || total === BAR_LB) return { kind: 'bar', text: 'just the bar' };
      if (total < BAR_LB) return { kind: 'sub', text: `under bar (${BAR_LB} lb)` };
      const perSide = (total - BAR_LB) / 2;
      let remaining = perSide;
      const parts = [];
      for (const p of PLATES_LB) {
        const count = Math.floor((remaining + 1e-9) / p);
        if (count > 0) { parts.push({ p, count }); remaining -= count * p; }
      }
      const exact = Math.abs(remaining) < 0.01;
      const list = parts.map(x => x.count > 1 ? `${x.count}×${x.p}` : `${x.p}`).join(' + ');
      return { kind: exact ? 'load' : 'approx', text: `bar + ${list}/side${exact ? '' : ' (≈)'}` };
    }
    const WEEKS = Array.from({ length: 13 }, (_, i) => i); // 0..12

    const STORE_KEY = 'regimen.v2'; // v2 = 3-day rotation rebuild; fresh start from week 0
    function loadStore() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { cycle: 'Regimen 2026-2', data: {} }; }
      catch { return { cycle: 'Regimen 2026-2', data: {} }; }
    }
    function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
    let store = loadStore();
    function getVal(week, exId) {
      return store.data[`w${week}`]?.[exId] ?? '';
    }
    function setVal(week, exId, val) {
      const k = `w${week}`;
      if (!store.data[k]) store.data[k] = {};
      if (val === '' || val === null || val === undefined) delete store.data[k][exId];
      else store.data[k][exId] = Number(val);
      saveStore(store);
    }
    function weekHasAny(week) {
      const k = `w${week}`;
      return store.data[k] && Object.keys(store.data[k]).length > 0;
    }
    function lastValueBefore(week, exId) {
      for (let w = week - 1; w >= 0; w--) {
        const v = getVal(w, exId);
        if (v !== '') return { week: w, val: v };
      }
      return null;
    }
    function getMark(week, exId) {
      const w = store.data[`w${week}`];
      if (!w) return null;
      if (w[`${exId}_inc`]) return 'inc';
      if (w[`${exId}_hold`]) return 'hold';
      return null;
    }
    function setMark(week, exId, mark) {
      const k = `w${week}`;
      if (!store.data[k]) store.data[k] = {};
      delete store.data[k][`${exId}_inc`];
      delete store.data[k][`${exId}_hold`];
      if (mark === 'inc') store.data[k][`${exId}_inc`] = true;
      else if (mark === 'hold') store.data[k][`${exId}_hold`] = true;
      saveStore(store);
    }
    function todaySuggestion(week, exId) {
      // Today is based on the most recent logged week's value,
      // bumped by +5 only if that week was marked 'inc' (green).
      const last = lastValueBefore(week, exId);
      if (!last) return null;
      const prevMark = getMark(last.week, exId);
      const bumped = prevMark === 'inc';
      return { val: bumped ? last.val + 5 : last.val, bumped };
    }

    // --- State ---
    let currentWeek = (() => {
      // default to highest week with data, else 0
      for (let w = WEEKS.length - 1; w >= 0; w--) if (weekHasAny(w)) return w;
      return 0;
    })();

    // --- Render ---
    const cycleLabel = document.getElementById('cycleLabel');
    const weekRail = document.getElementById('weekRail');
    const daysEl = document.getElementById('days');
    const progTable = document.getElementById('progTable');

    function renderHeader() {
      cycleLabel.textContent = store.cycle;
    }

    function renderWeekRail() {
      weekRail.innerHTML = '';
      WEEKS.forEach(w => {
        const b = document.createElement('button');
        b.className = 'week-pill' + (w === currentWeek ? ' active' : '') + (weekHasAny(w) ? ' has-data' : '');
        b.innerHTML = `Week<span class="num">${w}</span>`;
        b.addEventListener('click', () => { currentWeek = w; renderAll(); b.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' }); });
        weekRail.appendChild(b);
      });
      // scroll active into view
      requestAnimationFrame(() => {
        const active = weekRail.querySelector('.week-pill.active');
        if (active) active.scrollIntoView({ inline: 'center', behavior: 'auto', block: 'nearest' });
      });
    }

    // Shared lifts render as one row per day; all rows for an exId stay in sync.
    let exRowRefs = {};    // exId -> [refresh fns]
    let dayCountRefs = []; // per-day count updaters
    function syncEx(exId) {
      (exRowRefs[exId] || []).forEach(fn => fn());
      dayCountRefs.forEach(fn => fn());
      const pill = weekRail.children[currentWeek];
      if (pill) pill.classList.toggle('has-data', weekHasAny(currentWeek));
    }

    function renderDays() {
      daysEl.innerHTML = '';
      exRowRefs = {};
      dayCountRefs = [];
      DAYS.forEach(day => {
        const exList = day.exIds.map(id => EX_BY_ID[id]);
        const wrap = document.createElement('section');
        wrap.className = 'day';
        wrap.innerHTML = `<h2>${day.title}<span class="count"></span></h2>`;
        const countEl = wrap.querySelector('.count');
        function updateCount() {
          const filled = exList.filter(e => getVal(currentWeek, e.id) !== '').length;
          countEl.textContent = `${filled}/${exList.length}`;
        }
        dayCountRefs.push(updateCount);
        exList.forEach(ex => {
          const row = document.createElement('div');
          row.className = 'ex';
          const today = todaySuggestion(currentWeek, ex.id);
          const todayText = today
            ? ` · <span class="today${today.bumped ? ' up' : ''}">Today: ${today.val}${today.bumped ? ' ↑' : ''}</span>`
            : ' · no prior data';
          row.innerHTML = `
            <div>
              <div class="name">${ex.name}</div>
              <div class="meta">${ex.scheme}${todayText}</div>
              <div class="plates"></div>
            </div>
            <input type="number" inputmode="decimal" step="2.5" min="0" placeholder="lb" data-ex="${ex.id}">
            <div class="mark-btns">
              <button class="hold-btn" type="button" aria-label="No increase: copy Today" title="No increase: copy Today">=</button>
              <button class="inc-btn" type="button" aria-label="Increase: copy Today, bump next week" title="Increase: copy Today, bump next week">↑</button>
            </div>
          `;
          const input = row.querySelector('input');
          const platesEl = row.querySelector('.plates');
          const incBtn = row.querySelector('.inc-btn');
          const holdBtn = row.querySelector('.hold-btn');
          function updatePlates() {
            if (!ex.barbell) { platesEl.textContent = ''; platesEl.className = 'plates'; return; }
            // Show plates for the entered weight; if the field is empty, fall back
            // to the Today suggestion so the loading hint is always visible.
            const basis = input.value !== '' ? input.value : (today ? today.val : '');
            const b = plateBreakdown(basis);
            if (!b) { platesEl.textContent = ''; platesEl.className = 'plates'; return; }
            platesEl.textContent = b.text;
            platesEl.className = 'plates ' + b.kind;
          }
          function refreshRow() {
            const val = getVal(currentWeek, ex.id);
            // Don't clobber the input the user is actively typing in
            if (document.activeElement !== input) input.value = val;
            row.classList.toggle('done', val !== '');
            const m = getMark(currentWeek, ex.id);
            incBtn.classList.toggle('active', m === 'inc');
            holdBtn.classList.toggle('active', m === 'hold');
            updatePlates();
          }
          (exRowRefs[ex.id] = exRowRefs[ex.id] || []).push(refreshRow);
          function applyMark(mark) {
            const current = getMark(currentWeek, ex.id);
            const newMark = current === mark ? null : mark;
            setMark(currentWeek, ex.id, newMark);
            // Both buttons copy Today into the field.
            // Green (inc) additionally marks intent so NEXT week's Today is this value + 5.
            if ((newMark === 'hold' || newMark === 'inc') && today) {
              setVal(currentWeek, ex.id, today.val);
            }
            syncEx(ex.id);
          }
          incBtn.addEventListener('click', () => applyMark('inc'));
          holdBtn.addEventListener('click', () => applyMark('hold'));
          input.addEventListener('input', () => {
            setVal(currentWeek, ex.id, input.value);
            syncEx(ex.id);
          });
          input.addEventListener('blur', () => {
            // 0 in a barbell exercise = "just the bar" → snap to BAR_LB
            if (ex.barbell && input.value !== '' && Number(input.value) === 0) {
              input.value = BAR_LB;
              input.dispatchEvent(new Event('input'));
            }
          });
          refreshRow();
          wrap.appendChild(row);
        });
        updateCount();
        daysEl.appendChild(wrap);
      });
    }

    function renderProgression() {
      let html = '<thead><tr><th>Exercise</th>';
      WEEKS.forEach(w => html += `<th>W${w}</th>`);
      html += '</tr></thead><tbody>';
      // Bodyweight row first
      html += `<tr><td>Bodyweight</td>`;
      WEEKS.forEach(w => {
        const v = getVal(w, 'bw');
        html += v === '' ? '<td class="empty">—</td>' : `<td class="has-val">${v}</td>`;
      });
      html += '</tr>';
      EXERCISES.forEach(ex => {
        html += `<tr><td>${ex.name}</td>`;
        let prev = null;
        WEEKS.forEach(w => {
          const v = getVal(w, ex.id);
          if (v === '') html += '<td class="empty">—</td>';
          else {
            const cls = (prev !== null && v > prev) ? 'has-val up' : 'has-val';
            html += `<td class="${cls}">${v}</td>`;
            prev = v;
          }
        });
        html += '</tr>';
      });
      html += '</tbody>';
      progTable.innerHTML = html;
    }

    function renderBodyweight() {
      const el = document.getElementById('bodyweight');
      const cur = getVal(currentWeek, 'bw');
      const last = lastValueBefore(currentWeek, 'bw');
      el.className = 'bw';
      el.innerHTML = `
        <div>
          <div class="name">Bodyweight</div>
          <div class="meta">Week ${currentWeek}${last ? ` · <span class="last">last: ${last.val} (W${last.week})</span>` : ' · no prior data'}</div>
        </div>
        <input type="number" inputmode="decimal" step="0.1" min="0" placeholder="lb" value="${cur}">
      `;
      const input = el.querySelector('input');
      input.addEventListener('input', () => {
        setVal(currentWeek, 'bw', input.value);
        const pill = weekRail.children[currentWeek];
        if (pill) pill.classList.toggle('has-data', weekHasAny(currentWeek));
      });
    }

    function renderAll() {
      renderHeader();
      renderWeekRail();
      renderBodyweight();
      renderDays();
      renderProgression();
    }

    // --- Tabs ---
    const tabLog = document.getElementById('tabLog');
    const tabProg = document.getElementById('tabProg');
    const logView = document.getElementById('logView');
    const progView = document.getElementById('progView');
    function showLog() {
      tabLog.classList.add('active'); tabProg.classList.remove('active');
      logView.classList.remove('hidden'); progView.classList.add('hidden');
    }
    function showProg() {
      tabProg.classList.add('active'); tabLog.classList.remove('active');
      progView.classList.remove('hidden'); logView.classList.add('hidden');
      renderProgression();
    }
    tabLog.addEventListener('click', showLog);
    tabProg.addEventListener('click', showProg);

    // --- Toolbar ---
    document.getElementById('exportBtn').addEventListener('click', () => {
      let csv = 'Exercise,' + WEEKS.map(w => 'W' + w).join(',') + '\n';
      const bwRow = ['Bodyweight'];
      WEEKS.forEach(w => bwRow.push(getVal(w, 'bw')));
      csv += bwRow.join(',') + '\n';
      EXERCISES.forEach(ex => {
        const row = [ex.name];
        WEEKS.forEach(w => row.push(getVal(w, ex.id)));
        csv += row.join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `regimen-${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Erase all logged weights? This cannot be undone.')) {
        store = { cycle: store.cycle, data: {} };
        saveStore(store);
        currentWeek = 0;
        renderAll();
      }
    });

    // --- Service worker (offline) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }

    renderAll();
  </script>
</body>
</html>
